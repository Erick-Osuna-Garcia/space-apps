[project]
name = "nisar-pipeline"
version = "0.1.0"
description = "Offline pipeline: NISAR GUNW + Copernicus DEM -> static web assets for the isometric explorer"
requires-python = ">=3.11"
dependencies = [
  "asf_search>=8.0",
  "h5py>=3.11",
  "numpy>=2.0",
  "rasterio>=1.4",
  "pyproj>=3.6",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "earthaccess>=0.14",
  "shapely>=2.0",
]

[project.scripts]
nisar-pipeline = "nisar_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nisar_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
